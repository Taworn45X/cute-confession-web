<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="gradCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#990033" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#gradCenter)" />

  <!-- Outer Rings -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#ff2a6d" stroke-width="2" filter="url(#glow)" />
  <circle cx="250" cy="250" r="225" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="#d0004b" stroke-width="3" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="#ff5c8a" stroke-width="1" stroke-dasharray="12,8" />

  <!-- Outer Decorative Teeth / Dials -->
  <g stroke="#ff2a6d" stroke-width="2">
    <line x1="250" y1="15" x2="250" y2="35" />
    <line x1="250" y1="465" x2="250" y2="485" />
    <line x1="15" y1="250" x2="35" y2="250" />
    <line x1="465" y1="250" x2="485" y2="250" />
    <line x1="84" y1="84" x2="98" y2="98" />
    <line x1="416" y1="416" x2="402" y2="402" />
    <line x1="416" y1="84" x2="402" y2="98" />
    <line x1="84" y1="416" x2="98" y2="402" />
  </g>

  <!-- Stars / Hexagram / Pentagram Geometry -->
  <!-- Triangle 1 -->
  <polygon points="250,55 418,348 82,348" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)" />
  <!-- Triangle 2 -->
  <polygon points="250,445 82,152 418,152" fill="none" stroke="#ff0055" stroke-width="2" filter="url(#glow)" />

  <!-- Inner Rings -->
  <circle cx="250" cy="250" r="110" fill="none" stroke="#ff5c8a" stroke-width="2" />
  <circle cx="250" cy="250" r="95" fill="none" stroke="#ff2a6d" stroke-width="1.5" stroke-dasharray="4,6" />
  <circle cx="250" cy="250" r="50" fill="none" stroke="#ff0055" stroke-width="2" />

  <!-- Runes and Glyphs -->
  <g fill="#ff5c8a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="250" y="210">★ 闇 ★</text>
    <text x="250" y="295">★ 契約 ★</text>
    <text x="200" y="255">混沌</text>
    <text x="300" y="255">運命</text>
  </g>

  <!-- Arcane dots -->
  <circle cx="250" cy="55" r="5" fill="#ff2a6d" />
  <circle cx="418" cy="348" r="5" fill="#ff2a6d" />
  <circle cx="82" cy="348" r="5" fill="#ff2a6d" />
  <circle cx="250" cy="445" r="5" fill="#ff2a6d" />
  <circle cx="82" cy="152" r="5" fill="#ff2a6d" />
  <circle cx="418" cy="152" r="5" fill="#ff2a6d" />
</svg>
