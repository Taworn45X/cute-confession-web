<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <filter id="mangaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#ff0055" />
    </filter>
  </defs>
  <style>
    .gogo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 58px;
      font-weight: 900;
      fill: #ffffff;
      stroke: #1a000d;
      stroke-width: 4px;
      paint-order: stroke fill;
    }
  </style>
  <g filter="url(#mangaShadow)">
    <text x="20" y="60" class="gogo" transform="rotate(-12, 20, 60)">ゴ</text>
    <text x="50" y="120" class="gogo" transform="rotate(-6, 50, 120)">ゴ</text>
    <text x="80" y="180" class="gogo" transform="rotate(2, 80, 180)">ゴ</text>
  </g>
</svg>
